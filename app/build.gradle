plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def productionAdMobAppId = 'ca-app-pub-8084313520610270~1492953098'
def productionBannerAdUnitId = 'ca-app-pub-8084313520610270/1264713228'
def googleTestBannerAdUnitId = 'ca-app-pub-3940256099942544/9214589741'

configurations.configureEach {
    // GMA Next-Gen must not coexist with the legacy Mobile Ads artifacts.
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
}

android {
    namespace 'com.afradadmedia.reducephotosize'
    compileSdk 37

    defaultConfig {
        applicationId 'com.afradadmedia.reducephotosize'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders = [adMobAppId: productionAdMobAppId]
        buildConfigField 'String', 'ADMOB_APP_ID', '"ca-app-pub-8084313520610270~1492953098"'
        buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', '"ca-app-pub-8084313520610270/1264713228"'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.s7test'
            versionNameSuffix '-s7test'
            // Provider-backed UMP uses the production App ID, but debug ad traffic stays on
            // Google's dedicated demo banner unit to avoid invalid live-ad activity.
            buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', '"ca-app-pub-3940256099942544/9214589741"'
        }
        release {
            buildConfigField 'String', 'ADMOB_BANNER_AD_UNIT_ID', '"ca-app-pub-8084313520610270/1264713228"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.0' // Resolves ActivityResult lint requirement in the AdMob dependency graph.
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
