plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

configurations.configureEach {
    // GMA Next-Gen must not coexist with the legacy Mobile Ads artifacts.
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
}

android {
    namespace 'com.afradadmedia.reducephotosize'
    compileSdk 37

    defaultConfig {
        applicationId 'com.afradadmedia.reducephotosize'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.0' // Resolves ActivityResult lint requirement in the AdMob dependency graph.
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
