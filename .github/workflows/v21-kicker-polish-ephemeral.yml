name: V2.1 screenshot kicker polish ephemeral

on:
  push:
    branches:
      - task/TASK-S5-007
    paths:
      - .github/workflows/v21-kicker-polish-ephemeral.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/TASK-S5-007
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Apply composition-only polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import hashlib, json, statistics
          root = Path(".")
          base = root / "store/assets/play/en-US/screenshots_v2"
          names = [
              "01_verified_result_1080x1920.png",
              "02_set_kb_limit_1080x1920.png",
              "03_save_share_1080x1920.png",
              "04_custom_limit_1080x1920.png",
              "05_on_device_1080x1920.png",
              "06_not_met_1080x1920.png",
          ]
          paths = [base / n for n in names]
          new_kicker = "PHOTO COMPRESSOR: KB LIMIT"
          auth_ref = "USER_OPTION_1_2026-10-02_S5_PLAY_SCREENSHOT_V2_1_BRAND_KICKER_MICRO_POLISH"
          app_rect = (90, 260, 990, 1740)
          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for c in iter(lambda: f.read(1048576), b""):
                      h.update(c)
              return h.hexdigest()
          fonts = [
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
          ]
          font_path = next((f for f in fonts if Path(f).exists()), None)
          if not font_path:
              raise SystemExit("bold sans font unavailable")
          final_hashes = {}
          fidelity = {}
          meta = {}
          for p in paths:
              im = Image.open(p).convert("RGB")
              before = im.copy()
              bg = im.getpixel((20, 20))
              pts, cols = [], []
              for y in range(30, 115):
                  for x in range(35, 650):
                      px = im.getpixel((x, y))
                      if sum(abs(px[i] - bg[i]) for i in range(3)) >= 18:
                          pts.append((x, y))
                          cols.append(px)
              if not pts:
                  raise SystemExit("kicker pixels not detected: " + p.name)
              bx0 = min(x for x, y in pts)
              by0 = min(y for x, y in pts)
              bx1 = max(x for x, y in pts) + 1
              by1 = max(y for x, y in pts) + 1
              color = tuple(int(statistics.median([c[i] for c in cols])) for i in range(3))
              draw = ImageDraw.Draw(im)
              draw.rectangle((bx0-7, by0-7, 620, by1+7), fill=bg)
              chosen = None
              for size in range(24, 13, -1):
                  f = ImageFont.truetype(font_path, size=size)
                  tb = draw.textbbox((0, 0), new_kicker, font=f)
                  if (tb[2]-tb[0]) <= 560 and (tb[3]-tb[1]) <= (by1-by0)+6:
                      chosen = f
                      break
              if chosen is None:
                  chosen = ImageFont.truetype(font_path, size=14)
              tb = draw.textbbox((0, 0), new_kicker, font=chosen)
              th = tb[3]-tb[1]
              ty = by0 + ((by1-by0)-th)//2 - tb[1]
              draw.text((bx0, ty), new_kicker, font=chosen, fill=color)
              if before.crop(app_rect).tobytes() != im.crop(app_rect).tobytes():
                  raise SystemExit("embedded app pixel drift: " + p.name)
              if before.crop((0,260,1080,1920)).tobytes() != im.crop((0,260,1080,1920)).tobytes():
                  raise SystemExit("non-header pixel drift: " + p.name)
              im.save(p, "PNG", optimize=True)
              final_hashes[p.name] = sha(p)
              fidelity[p.name] = "PASS_EXACT_PIXEL_IDENTITY_APP_RECT"
              meta[p.name] = {"old_bbox":[bx0,by0,bx1,by1],"font":Path(font_path).name,"font_size":chosen.size,"background_rgb":list(bg),"text_rgb":list(color)}
          tw, th, gap, margin = 270, 480, 24, 24
          sheet = Image.new("RGB", (margin*2 + tw*3 + gap*2, margin*2 + th*2 + gap), (247,243,239))
          for i, p in enumerate(paths):
              t = Image.open(p).convert("RGB").resize((tw,th), Image.Resampling.LANCZOS)
              sheet.paste(t, (margin + (i%3)*(tw+gap), margin + (i//3)*(th+gap)))
          contact = base / "CONTACT_SHEET_6UP.png"
          sheet.save(contact, "PNG", optimize=True)
          manifest_path = base / "composition_manifest.json"
          manifest = json.loads(manifest_path.read_text())
          manifest["schema"] = "S5_PLAY_SCREENSHOT_PREMIUM_COMPOSITION_MANIFEST_v1.1"
          manifest["composition_version"] = "V2.1_BRAND_KICKER_MICRO_POLISH"
          manifest["authorization_ref"] = auth_ref
          manifest["external_brand_kicker"] = {"previous":"REDUCE PHOTO SIZE","current":new_kicker,"scope":"EXTERNAL_COMPOSITION_ONLY","embedded_app_pixels_changed":False,"emulator_recapture_required":False}
          manifest["pixel_fidelity"] = "PASS_EXACT_APP_RECT_ALL_SIX"
          for item in manifest["items"]:
              n = Path(item["final_path"]).name
              item["final_sha256"] = final_hashes[n]
              item["pixel_fidelity"] = "PASS_EXACT_APP_RECT"
          manifest["contact_sheet"] = {"path":str(contact),"sha256":sha(contact),"layout":"3x2"}
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          proof = {
              "schema":"S5_PLAY_SCREENSHOT_V2_1_BRAND_KICKER_PROOF_v1.0",
              "authorization_ref":auth_ref,
              "scope":"COMPOSITION_ONLY",
              "previous_kicker":"REDUCE PHOTO SIZE",
              "new_kicker":new_kicker,
              "emulator_recapture":False,
              "app_source_mutation":False,
              "embedded_app_rect":list(app_rect),
              "pixel_fidelity":fidelity,
              "visual_meta":meta,
              "final_assets_sha256":final_hashes,
              "contact_sheet_sha256":sha(contact),
              "manifest_sha256":sha(manifest_path),
              "result":"PASS_READY_FOR_HUMAN_VISUAL_APPROVAL"
          }
          proof_path = root / "evidence/store/S5_PLAY_SCREENSHOT_V2_1_BRAND_KICKER_PROOF_v1.0.json"
          proof_path.write_text(json.dumps(proof, indent=2) + "\n")
          PY
          if git diff --name-only | grep -q '^app/'; then
            echo "Unauthorized app source mutation detected" >&2
            exit 1
          fi
          git rm .github/workflows/v21-kicker-polish-ephemeral.yml
          git config user.name "ai-prod-v2.1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add store/assets/play/en-US/screenshots_v2 evidence/store/S5_PLAY_SCREENSHOT_V2_1_BRAND_KICKER_PROOF_v1.0.json
          echo "Staged paths:"
          git diff --cached --name-only
          if git diff --cached --name-only | grep -q '^app/'; then
            echo "Unauthorized app source mutation staged" >&2
            exit 1
          fi
          git commit -m "store: polish Play screenshot brand kicker v2.1"
          git push origin HEAD:task/TASK-S5-007
