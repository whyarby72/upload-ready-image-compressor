name: W2 Privacy Artifact Audit

on:
  push:
    branches:
      - "audit/W2-privacy-artifact"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build exact debug artifact
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:processDebugManifest

      - name: Capture resolved runtime dependencies
        run: |
          set -euo pipefail
          mkdir -p w2-evidence
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > w2-evidence/debugRuntimeClasspath.txt

      - name: Capture merged manifest and artifact metadata
        run: |
          set -euo pipefail
          mkdir -p w2-evidence

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" w2-evidence/app-debug.apk
          sha256sum "$APK" | tee w2-evidence/app-debug.sha256

          MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E 'merged_manifest|merged_manifests|processDebugManifest' | head -n 1 || true)"
          if [ -z "$MANIFEST" ]; then
            echo "Merged manifest not found" >&2
            find app/build/intermediates -type f -name AndroidManifest.xml -print >&2 || true
            exit 2
          fi
          cp "$MANIFEST" w2-evidence/AndroidManifest-merged-debug.xml

          {
            echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
            echo "SOURCE_BRANCH=$(git branch --show-current)"
            echo "APK_PATH=$APK"
            echo "APK_BYTES=$(stat -c %s "$APK")"
            echo "MERGED_MANIFEST_SOURCE=$MANIFEST"
            echo "JAVA_VERSION=$(java -version 2>&1 | head -n 1)"
            echo "GRADLE_VERSION=$(./gradlew --version | awk '/Gradle / {print $2; exit}')"
          } > w2-evidence/BUILD_METADATA.txt

          grep -oE '<uses-permission[^>]*android:name="[^"]+"' "$MANIFEST"             | sed -E 's/.*android:name="([^"]+)".*/\1/'             | sort -u             > w2-evidence/merged-manifest-permissions.txt || true

          grep -oE '<uses-feature[^>]*android:name="[^"]+"' "$MANIFEST"             | sed -E 's/.*android:name="([^"]+)".*/\1/'             | sort -u             > w2-evidence/merged-manifest-features.txt || true

          grep -E 'com.google.android.gms.ads.APPLICATION_ID|provider|service|receiver|activity' "$MANIFEST"             > w2-evidence/merged-manifest-components-excerpt.txt || true

      - name: Static privacy assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("w2-evidence/AndroidManifest-merged-debug.xml").read_text(encoding="utf-8")
          deps = Path("w2-evidence/debugRuntimeClasspath.txt").read_text(encoding="utf-8")

          checks = {
              "contains_gma_next_gen_1_5_0": "ads-mobile-sdk:1.5.0" in deps,
              "contains_ump_4_0_0": "user-messaging-platform:4.0.0" in deps,
              "contains_legacy_play_services_ads": "play-services-ads:" in deps or "play-services-ads-lite:" in deps,
              "manifest_has_sample_app_id": "ca-app-pub-3940256099942544~3347511713" in manifest,
              "manifest_has_production_app_id": "ca-app-pub-8084313520610270~1492953098" in manifest,
          }

          lines = [f"{k}={'YES' if v else 'NO'}" for k,v in checks.items()]
          Path("w2-evidence/STATIC_ASSERTIONS.txt").write_text("\n".join(lines)+"\n", encoding="utf-8")

          assert checks["contains_gma_next_gen_1_5_0"]
          assert checks["contains_ump_4_0_0"]
          assert not checks["contains_legacy_play_services_ads"]
          assert checks["manifest_has_sample_app_id"]
          assert not checks["manifest_has_production_app_id"]
          PY

      - name: Upload W2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: w2-privacy-artifact-evidence
          path: w2-evidence/
          if-no-files-found: error
          retention-days: 30
