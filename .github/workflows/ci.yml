name: AI-PROD Android CI
on:
  push:
    branches: [main, develop, "task/**", "release/**"]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Java
        if: ${{ hashFiles('gradlew') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        if: ${{ hashFiles('gradlew') != '' }}
        uses: gradle/actions/setup-gradle@v4
      - name: Verify
        run: bash scripts/ci_verify.sh
      - name: Upload W2 artifact audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: w2-artifact-audit
          path: build/w2-audit/
          if-no-files-found: warn
          retention-days: 30
